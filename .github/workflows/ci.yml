name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CrioFire.slnx

      - name: Build
        run: dotnet build CrioFire.slnx --configuration Release --no-restore

      # Published before testing, so the installer job can build MSIs even if a test fails.
      - name: Publish (unsigned, for inspection)
        shell: pwsh
        run: ./build/publish.ps1 -Arch ${{ matrix.arch }} -Version "0.0.0-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: criofire-ci-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          retention-days: 7

      # One project at a time, each with its own results file (two .trx files written in the same
      # second can otherwise overwrite each other).
      - name: Test (unit tests and real firewall tests)
        env:
          CRIOFIRE_INTEGRATION: '1'   # runners are administrators, so the WFP tests really run
        shell: pwsh
        run: |
          $code = 0
          foreach ($project in 'CrioFire.Tests', 'CrioFire.IntegrationTests') {
            dotnet test "tests/$project" --configuration Release --no-build --logger "trx;LogFileName=$project.trx" --results-directory "TestResults/$project"
            if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
          }
          exit $code

      - name: Test report
        if: always()
        shell: pwsh
        run: ./build/test-report.ps1 -ResultsDir TestResults -Title "Tests (${{ matrix.arch }})" -RequireProject CrioFire.IntegrationTests

  installer:
    name: Build and test installers (MSI)
    needs: build-and-test
    # Also when tests failed: the published apps are uploaded before testing.
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          pattern: criofire-ci-*
          path: out

      - name: Build x64 and ARM64 MSIs (unsigned)
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            ./build/package-msi.ps1 -Arch $arch -Version "0.0.${{ github.run_number }}" -PublishDir "out/criofire-ci-$arch"
          }

      # Install the x64 MSI on the runner, check that everything is in place, then uninstall and
      # check that nothing is left. Learning mode, so the runner's own connections keep working.
      - name: Install, check and uninstall the x64 MSI
        shell: pwsh
        run: ./build/test-msi.ps1 -Msi (Get-Item out/msi/criofire-*-x64.msi).FullName

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criofire-ci-msi
          path: |
            out/msi/*.msi
            out/msi/*.log
          retention-days: 7
