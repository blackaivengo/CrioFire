version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ['*']
    # CrioFire targets .NET 10 (LTS); take its patches, not the next major .NET's packages.
    ignore:
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
      # xunit 4 needs a planned migration (test runner and attribute changes).
      - dependency-name: 'xunit.v3'
        update-types: ['version-update:semver-major']
      - dependency-name: 'xunit.runner.visualstudio'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
