version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ['*']
    # CrioFire targets .NET 10 (LTS); take its patches, not the next major .NET's packages.
    ignore:
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
